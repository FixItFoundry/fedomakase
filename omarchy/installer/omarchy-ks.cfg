%end

# -------------------------------------------------------------------------
# POST-INSTALL (NO CHROOT): Copy payload files from ISO into the new system
# -------------------------------------------------------------------------
%post --nochroot --log=/mnt/sysimage/var/log/omarchy-copy.log
echo "[Omarchy Fedora Setup] Copying Omarchy payload from ISO to sysimage..."
if [ -d /run/install/repo/omarchy-fedora ]; then
  mkdir -p /mnt/sysimage/usr/share/omarchy
  cp -rf /run/install/repo/omarchy-fedora/* /mnt/sysimage/usr/share/omarchy/
else
  echo "WARNING: /run/install/repo/omarchy-fedora not found!"
fi

# Persist Gum installer choices into the chroot for %post (chroot) to consume
if [ -f /tmp/omarchy-ks-include.cfg ]; then
  cp /tmp/omarchy-ks-include.cfg /mnt/sysimage/root/omarchy-ks-include.cfg
  echo "[Omarchy Fedora Setup] Saved user choices to /root/omarchy-ks-include.cfg"
fi
# Also copy the %pre diagnostic log (only works if we had a --nochroot mount)
if [ -f /tmp/omarchy-pre.log ]; then
  cp /tmp/omarchy-pre.log /mnt/sysimage/root/omarchy-pre.log 2>/dev/null || true
fi
# Also persist LUKS passphrase if present
if [ -f /tmp/omarchy-luks-pass ]; then
  cp /tmp/omarchy-luks-pass /mnt/sysimage/root/omarchy-luks-pass
  chmod 600 /mnt/sysimage/root/omarchy-luks-pass
  echo "[Omarchy Fedora Setup] Saved LUKS passphrase to /root/omarchy-luks-pass"
fi
%end

# -------------------------------------------------------------------------
# POST-INSTALL (CHROOT): Configure the new system
# -------------------------------------------------------------------------
%post --log=/var/log/omarchy-install.log

echo "[Omarchy Fedora Setup] Starting post-install configuration..."

# --- Apply user's actual choices from Gum installer ---
CHOICE_FILE="/root/omarchy-ks-include.cfg"
CHOSEN_USER="omarchy"
CHOSEN_PASS="omarchy"

if [ -f "$CHOICE_FILE" ]; then
  echo "[Omarchy Fedora Setup] Applying user choices from $CHOICE_FILE"
  data=$(grep -E '^user ' "$CHOICE_FILE" 2>/dev/null || true)
  if [ -n "$data" ]; then
    parsed=$(echo "$data" | sed -n 's/.*--name=\([^ ]*\).*/\1/p')
    [ -n "$parsed" ] && CHOSEN_USER="$parsed"
    parsed=$(echo "$data" | sed -n 's/.*--password=\([^ ]*\).*/\1/p')
    [ -n "$parsed" ] && CHOSEN_PASS="$parsed"
  fi
fi

if [ "$CHOSEN_USER" != "omarchy" ] && id omarchy &>/dev/null; then
  echo "[Omarchy Fedora Setup] Creating chosen user: $CHOSEN_USER"
  useradd -m -G wheel -s /bin/bash -c "Omarchy User" "$CHOSEN_USER"
  echo "$CHOSEN_USER:$CHOSEN_PASS" | chpasswd
  userdel -rf omarchy 2>/dev/null || true
elif [ "$CHOSEN_PASS" != "omarchy" ]; then
  echo "[Omarchy Fedora Setup] Updating password for $CHOSEN_USER"
  echo "$CHOSEN_USER:$CHOSEN_PASS" | chpasswd
fi
first_user="$CHOSEN_USER"

# 1. Enable System Services
systemctl enable sddm.service
systemctl enable NetworkManager.service
systemctl enable bluetooth.service
systemctl enable docker.service
systemctl enable power-profiles-daemon.service
systemctl set-default graphical.target

# 2. Configure Flathub
flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true

# 3. Seed Omarchy Configurations
if [ -d /usr/share/omarchy ]; then
  chmod +x /usr/share/omarchy/bin/* /usr/share/omarchy/installer/* 2>/dev/null || true
  ln -sf /usr/share/omarchy/bin/omarchy /usr/local/bin/omarchy
  chmod +x /usr/local/bin/omarchy 2>/dev/null || true
  
  if [ -d /usr/share/omarchy/etc ]; then
    cp -rf /usr/share/omarchy/etc/* /etc/
  fi

  if [ -d /usr/share/omarchy/default/sddm/omarchy ]; then
    mkdir -p /usr/share/sddm/themes
    cp -rf /usr/share/omarchy/default/sddm/omarchy /usr/share/sddm/themes/omarchy
  fi

  if [ -d /usr/share/omarchy/default/wayland-sessions ]; then
    mkdir -p /usr/share/wayland-sessions
    cp -rf /usr/share/omarchy/default/wayland-sessions/* /usr/share/wayland-sessions/
  fi

  if [ -d /usr/share/omarchy/default/fonts ]; then
    mkdir -p /usr/share/fonts/omarchy
    cp -rf /usr/share/omarchy/default/fonts/* /usr/share/fonts/omarchy/ 2>/dev/null || true
    fc-cache -f 2>/dev/null || true
  fi

  if [ -d /usr/share/omarchy/default/fontconfig ]; then
    mkdir -p /etc/fonts/conf.d
    cp -rf /usr/share/omarchy/default/fontconfig/* /etc/fonts/conf.d/ 2>/dev/null || true
  fi

  if [ -d /usr/share/omarchy/default/applications ]; then
    mkdir -p /usr/share/applications
    cp -rf /usr/share/omarchy/default/applications/* /usr/share/applications/ 2>/dev/null || true
  fi

  export OMARCHY_PATH=/usr/share/omarchy
  export OMARCHY_INSTALL=/usr/share/omarchy/install
  if [ -f /usr/share/omarchy/install/config/theme-system.sh ]; then
    bash /usr/share/omarchy/install/config/theme-system.sh 2>/dev/null || true
  fi

  mkdir -p /etc/skel/.config/autostart
  cat << 'AUTOSTART_EOF' > /etc/skel/.config/autostart/omarchy-first-run.desktop
[Desktop Entry]
Type=Application
Name=Omarchy First Run Setup
Exec=/usr/share/omarchy/bin/omarchy-first-run
Hidden=false
NoDisplay=true
X-GNOME-Autostart-enabled=true
AUTOSTART_EOF
  chmod -R a+rX /etc/skel

  if [ -n "$first_user" ]; then
    echo "[Omarchy Fedora Setup] Seeding config for user: $first_user"
    mkdir -p "/home/$first_user/.config"
    cp -rf /usr/share/omarchy/config/* "/home/$first_user/.config/"
    chown -R "$first_user:$first_user" "/home/$first_user"
  fi
fi

# 4. Set Hyprland as Default Wayland Session for SDDM
mkdir -p /etc/sddm.conf.d
mkdir -p /etc/sddm
cat << 'SDDM_HYPR_EOF' > /etc/sddm/hyprland.conf
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
windowrulev2 = fullscreen, class:(.*)
SDDM_HYPR_EOF

cat << 'SDDM_EOF' > /etc/sddm.conf.d/10-wayland.conf
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=Hyprland -c /etc/sddm/hyprland.conf
SessionDir=/usr/share/wayland-sessions
SDDM_EOF

cat << 'SDDM_EOF' > /etc/sddm.conf.d/10-theme.conf
[Theme]
Current=omarchy
SDDM_EOF

# Pre-seed SDDM state to pick up the default user on first boot
mkdir -p /var/lib/sddm
if [ -n "$first_user" ]; then
  echo "[Omarchy Fedora Setup] Pre-seeding SDDM state for user: $first_user"
  cat << SDDM_STATE_EOF > /var/lib/sddm/state.conf
[Last]
User=${first_user}
Session=/usr/share/wayland-sessions/omarchy.desktop
SDDM_STATE_EOF
  chown -R sddm:sddm /var/lib/sddm 2>/dev/null || true
fi

# 5. Automated TPM2 Auto-Unlock Binding for LUKS Encryption
echo "[Omarchy Fedora Setup] Checking for LUKS encrypted volume to bind to TPM2..."
luks_partition=$(lsblk -o NAME,FSTYPE -dn 2>/dev/null | grep crypto_LUKS | awk '{print $1}' | head -n 1)
if [ -z "$luks_partition" ] && [ -f "$CHOICE_FILE" ]; then
  # Check if user requested encryption in the Gum installer (LUKS not applied
  # during install since autopart uses defaults — manual post-install needed)
  if grep -q 'encrypted' "$CHOICE_FILE" 2>/dev/null; then
    echo "[Omarchy Fedora Setup] User requested encryption, but autopart defaults did not include it."
    echo "[Omarchy Fedora Setup] To encrypt after install: sudo cryptsetup reencrypt --encrypt /dev/sdX"
  fi
fi
if [ -n "$luks_partition" ]; then
  pass_file=""
  if [ -f /root/omarchy-luks-pass ]; then
    pass_file="/root/omarchy-luks-pass"
  elif [ -f /mnt/sysimage/tmp/omarchy-luks-pass ]; then
    pass_file="/mnt/sysimage/tmp/omarchy-luks-pass"
  fi
  if [ -n "$pass_file" ] && [ -f "$pass_file" ]; then
    echo "Found encrypted partition /dev/$luks_partition. Binding to hardware TPM2 chip..."
    cat "$pass_file" | systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+7 --unlock-keyfile=- "/dev/$luks_partition" || true
    if [ -f /etc/crypttab ]; then
      sed -i 's/tpm2-device=off/tpm2-device=auto/g' /etc/crypttab 2>/dev/null || true
    fi
    dracut -f --regenerate-all || true
    rm -f "$pass_file" /mnt/sysimage/tmp/omarchy-luks-pass /tmp/omarchy-luks-pass /root/omarchy-luks-pass 2>/dev/null || true
  else
    echo "Encrypted partition found but no passphrase file available for TPM2 binding."
  fi
fi

echo "[Omarchy Fedora Setup] Post-install configuration complete!"
%end
