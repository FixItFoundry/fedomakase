# Omarchy Fedora Automated Installation Kickstart File (omarchy-ks.cfg)



# System Language & Keyboard
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network Configuration
network --bootproto=dhcp --device=link --activate

# Run Anaconda in text mode to avoid hiding errors behind a broken GUI
text
firstboot --disable
reboot

# Software Repositories
url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64"
repo --name="fedora-updates" --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64"
repo --name="copr-hyprland" --baseurl="https://copr-be.cloud.fedoraproject.org/results/nett00n/hyprland/fedora-44-x86_64/"

# -------------------------------------------------------------------------
# PRE-INSTALL: Run the interactive Gum UI on TTY3 to gather user settings
# -------------------------------------------------------------------------
%pre --interpreter=/bin/bash --erroronfail
echo "[Omarchy] %pre started at $(date)" > /tmp/omarchy-pre.log
echo "[Omarchy] PID=$$, TTY=$(tty)" >> /tmp/omarchy-pre.log
echo "[Omarchy] Kernel cmdline: $(cat /proc/cmdline)" >> /tmp/omarchy-pre.log

if [ -c /dev/tty3 ]; then
    exec < /dev/tty3 > /dev/tty3 2>&1
    chvt 3
fi
printf '\033[2J\033[H'

export TERM=linux
INSTALLER_PATH=""
for path in \
  /run/install/repo/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/source/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/isodir/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/sources/mount-0000-cdrom/omarchy-fedora/installer/omarchy-installer.sh; do
  if [ -f "$path" ]; then
    INSTALLER_PATH="$path"
    break
  fi
done

if [ -n "$INSTALLER_PATH" ]; then
  export PATH="$PATH:$(dirname "$INSTALLER_PATH")"
  if ! bash "$INSTALLER_PATH"; then
    echo "Installer was aborted or failed. Rebooting in 5 seconds..."
    sleep 5
    reboot
  fi
else
  echo "Installer script not found in any standard Anaconda mount paths (/run/install/*)"
  sleep 5
  poweroff -f
fi

chvt 1
%end

# Disk / Partitioning / User (hardcoded defaults — Gum installer choices applied in %post)
zerombr
clearpart --all --initlabel
autopart --type=btrfs
bootloader --timeout=1 --append="quiet"
rootpw --lock
user --name=omarchy --gecos="Omarchy User" --groups=wheel --plaintext --password="omarchy"

# -------------------------------------------------------------------------
# PACKAGES
# -------------------------------------------------------------------------
%packages
@core
@hardware-support
hyprland
hyprland-uwsm
uwsm
hyprpaper
hyprlock
hypridle
