rofi-wayland
swaync
slurp
grim
wl-clipboard
brightnessctl
pamixer
wireplumber
pipewire
pipewire-utils
xdg-desktop-portal
xdg-desktop-portal-gtk
xdg-desktop-portal-hyprland
sddm
qt6-qtwayland
qt6-qtdeclarative
qt6-qt5compat
qt6-qtsvg
plymouth
power-profiles-daemon
lxpolkit
kitty
foot
neovim
btop
fastfetch
fzf
ripgrep
fd-find
eza
zoxide
# starship
tmux
gum
bat
# lazygit
git
zsh
bash-completion
nautilus
evince
loupe
imv
mpv
gnome-disk-utility
gnome-calculator
flatpak
NetworkManager
NetworkManager-wifi
NetworkManager-bluetooth
bluez
bluez-tools
# bluez-firmware
linux-firmware
kernel-modules-extra
# iwl7260-firmware
iwlwifi-dvm-firmware
iwlwifi-mvm-firmware
realtek-firmware
alsa-firmware
wpa_supplicant
iwd
rfkill
jq
unzip
tar
xz
p7zip
ca-certificates
gcc
gcc-c++
make
clang
llvm
ruby
lua
python3
python3-pip
docker
docker-compose
google-noto-fonts-common
google-noto-emoji-fonts
google-noto-sans-fonts
