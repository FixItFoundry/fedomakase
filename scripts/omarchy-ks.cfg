# Omarchy Fedora Automated Installation Kickstart File (omarchy-ks.cfg)



# System Language & Keyboard
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network Configuration
network --bootproto=dhcp --device=link --activate

# Run Anaconda in text mode to avoid hiding errors behind a broken GUI
text
firstboot --disable
reboot

# Software Repositories
url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64"
repo --name="fedora-updates" --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64"
repo --name="copr-hyprland" --baseurl="https://copr-be.cloud.fedoraproject.org/results/nett00n/hyprland/fedora-44-x86_64/"

# -------------------------------------------------------------------------
# PRE-INSTALL: Run the interactive Gum UI on TTY3 to gather user settings
# -------------------------------------------------------------------------
%pre --interpreter=/bin/bash --erroronfail

if [ -c /dev/tty3 ]; then
    exec < /dev/tty3 > /dev/tty3 2>&1
    chvt 3
fi
printf '\033[2J\033[H'

export TERM=linux
if [ -f /run/install/repo/omarchy-fedora/installer/omarchy-installer.sh ]; then
  export PATH="$PATH:/run/install/repo/omarchy-fedora/installer"
  if ! bash /run/install/repo/omarchy-fedora/installer/omarchy-installer.sh; then
    echo "Installer was aborted or failed. Rebooting in 5 seconds..."
    sleep 5
    reboot
  fi
else
  echo "Installer script not found at /run/install/repo/omarchy-fedora/installer/omarchy-installer.sh"
  sleep 5
  poweroff -f
fi

chvt 1
%end

# -------------------------------------------------------------------------
# DISK / PARTITIONING / USER (hardcoded defaults)
# -------------------------------------------------------------------------
zerombr
clearpart --all --initlabel
autopart --type=btrfs
bootloader --timeout=1 --append="quiet"
rootpw --lock
user --name=omarchy --gecos="Omarchy User" --groups=wheel --plaintext --password="omarchy"

# -------------------------------------------------------------------------
# PACKAGES
# -------------------------------------------------------------------------
%packages
@core
@hardware-support
-gnome-shell
%end

# -------------------------------------------------------------------------
# POST-INSTALL (NO CHROOT): Copy payload files from ISO into the new system
# -------------------------------------------------------------------------
%post --nochroot --log=/mnt/sysimage/var/log/omarchy-copy.log
echo "[Omarchy Fedora Setup] Copying Omarchy payload from ISO to sysimage..."
if [ -d /run/install/repo/omarchy-fedora ]; then
  mkdir -p /mnt/sysimage/usr/share/omarchy
  cp -rf /run/install/repo/omarchy-fedora/* /mnt/sysimage/usr/share/omarchy/
else
  echo "WARNING: /run/install/repo/omarchy-fedora not found!"
fi
%end

# -------------------------------------------------------------------------
# POST-INSTALL (CHROOT): Configure the new system
# -------------------------------------------------------------------------
%post --log=/var/log/omarchy-install.log

echo "[Omarchy Fedora Setup] Starting post-install configuration..."

# 0. Enable COPR repo first so manifest packages resolve
echo "[Omarchy Fedora Setup] Enabling COPR repos..."
dnf copr enable -y nett00n/hyprland 2>/dev/null || true

# Install all base packages from the single source of truth manifest
manifest="/usr/share/omarchy/install/omarchy-fedora-base.packages"
if [[ -f $manifest ]]; then
  echo "[Omarchy Fedora Setup] Installing packages from $manifest..."
  packages=()
  while IFS= read -r line; do
    line="${line%%#*}"; line="${line//[[:space:]]/}"
    [[ -z $line ]] && continue
    packages+=("$line")
  done < "$manifest"
  if ((${#packages[@]} > 0)); then
    dnf install -y "${packages[@]}" 2>/dev/null || true
    echo "[Omarchy Fedora Setup] Package installation complete (${#packages[@]} packages)"
  fi
else
  echo "[Omarchy Fedora Setup] WARNING: Package manifest not found at $manifest"
fi

# 1. Enable System Services
systemctl enable sddm.service
systemctl enable NetworkManager.service
systemctl enable bluetooth.service
systemctl enable docker.service
systemctl enable docker.socket
systemctl enable cups.service
systemctl enable cups-browsed.service
systemctl enable avahi-daemon.service
systemctl enable systemd-resolved.service
systemctl enable power-profiles-daemon.service
systemctl mask NetworkManager-wait-online.service
systemctl set-default graphical.target

# 2. Configure Flathub
flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true

# 3. Seed Omarchy Configurations
if [ -d /usr/share/omarchy ]; then
  chmod +x /usr/share/omarchy/bin/* /usr/share/omarchy/installer/* 2>/dev/null || true
  ln -sf /usr/share/omarchy/bin/omarchy /usr/local/bin/omarchy
  chmod +x /usr/local/bin/omarchy 2>/dev/null || true
  
  if [ -d /usr/share/omarchy/etc ]; then
    cp -rf /usr/share/omarchy/etc/* /etc/
  fi

  if [ -d /usr/share/omarchy/default/sddm/omarchy ]; then
    mkdir -p /usr/share/sddm/themes
    cp -rf /usr/share/omarchy/default/sddm/omarchy /usr/share/sddm/themes/omarchy
  fi

  mkdir -p /etc/skel/.config
  cp -rf /usr/share/omarchy/config/* /etc/skel/.config/

  # Install default terminal preference for xdg-terminal-exec
  mkdir -p /etc/xdg
  cp /usr/share/omarchy/default/xdg-terminal-exec/hyprland-xdg-terminals.list /etc/xdg/xdg-terminals.list

  # Install preinstalled web app desktop entries
  if [ -d /usr/share/omarchy/applications ]; then
    mkdir -p /etc/skel/.local/share/applications
    cp -rf /usr/share/omarchy/applications/*.desktop /etc/skel/.local/share/applications/
    cp -rf /usr/share/omarchy/applications/icons /etc/skel/.local/share/icons/ 2>/dev/null || true
  fi

  for user_dir in /home/*; do
    if [ -d "$user_dir" ]; then
      user_name=$(basename "$user_dir")
      if [ "$user_name" != "lost+found" ]; then
        mkdir -p "$user_dir/.config"
        cp -rf /usr/share/omarchy/config/* "$user_dir/.config/"
        chown -R "$user_name:$user_name" "$user_dir/.config"

        if [ -d /usr/share/omarchy/applications ]; then
          mkdir -p "$user_dir/.local/share/applications"
          cp -rf /usr/share/omarchy/applications/*.desktop "$user_dir/.local/share/applications/"
          cp -rf /usr/share/omarchy/applications/icons "$user_dir/.local/share/icons/" 2>/dev/null || true
          chown -R "$user_name:$user_name" "$user_dir/.local/share/applications" "$user_dir/.local/share/icons" 2>/dev/null || true
        fi
      fi
    fi
  done
fi

# 4. Set Hyprland as Default Wayland Session for SDDM
mkdir -p /etc/sddm.conf.d
cat << 'SDDM_EOF' > /etc/sddm.conf.d/10-wayland.conf
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=Hyprland
SessionDir=/usr/share/wayland-sessions
SDDM_EOF

cat << 'SDDM_EOF' > /etc/sddm.conf.d/10-theme.conf
[Theme]
Current=omarchy
SDDM_EOF

# 5. Automated TPM2 Auto-Unlock Binding for LUKS Encryption
echo "[Omarchy Fedora Setup] Checking for LUKS encrypted volume to bind to TPM2..."
luks_partition=$(lsblk -o NAME,FSTYPE -dn | grep crypto_LUKS | awk '{print $1}' | head -n 1)
if [[ -n $luks_partition ]]; then
  echo "Found encrypted partition /dev/$luks_partition..."

  if [[ -e /dev/tpmrm0 ]] || [[ -f /sys/class/tpm/tpm0/tpm_version_major ]]; then
    echo "Binding to hardware TPM2 chip (PCRs 0+7)..."
    systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+7 "/dev/$luks_partition" || true

    # Configure dracut for TPM2 boot support
    echo "Configuring dracut for TPM2..."
    mkdir -p /etc/dracut.conf.d
    echo 'add_dracutmodules+=" tpm2-tss "' > /etc/dracut.conf.d/tpm2.conf

    # Remove legacy keyfile config from old TPM 1.2 workaround
    rm -f /etc/dracut.conf.d/omarchy-keyfile.conf

    # Update crypttab to use TPM2
    if [[ -f /etc/crypttab ]]; then
      luks_uuid=$(cryptsetup luksUUID "/dev/$luks_partition" 2>/dev/null || true)
      if [[ -n $luks_uuid ]] && grep -q "$luks_uuid" /etc/crypttab 2>/dev/null; then
        if ! grep -q "tpm2-device=auto" /etc/crypttab; then
          sed -i "/$luks_uuid/s/[[:space:]]*$/ tpm2-device=auto/" /etc/crypttab
        fi
      fi
    fi

    # Rebuild initramfs for current kernel
    dracut -f || true
  else
    echo "WARNING: No TPM2 device found — LUKS will require passphrase at boot."
    echo "Enable TPM2 in BIOS and run: sudo omarchy-setup-tpm2-unlock"
  fi
fi

# 6. Install Python packages for Omarchy screensaver
echo "[Omarchy Fedora Setup] Installing terminaltexteffects for screensaver..."
pip3 install terminaltexteffects 2>/dev/null || true

# 7. System theme and icon setup
echo "[Omarchy Fedora Setup] Configuring system theme..."
mkdir -p /usr/share/icons/Yaru/scalable/actions
ln -snf /usr/share/icons/Adwaita/symbolic/actions/go-previous-symbolic.svg \
        /usr/share/icons/Yaru/scalable/actions/go-previous-symbolic.svg
ln -snf /usr/share/icons/Adwaita/symbolic/actions/go-next-symbolic.svg \
        /usr/share/icons/Yaru/scalable/actions/go-next-symbolic.svg
gtk-update-icon-cache /usr/share/icons/Yaru &>/dev/null || true
mkdir -p /etc/chromium/policies/managed
chmod a+rw /etc/chromium/policies/managed
mkdir -p /usr/lib/chromium
echo '{"browser":{"theme":{"color_scheme":0,"color_scheme2":0}}}' > \
  /usr/lib/chromium/initial_preferences

# 8. Configure locate/updatedb
echo "[Omarchy Fedora Setup] Configuring locate..."
if [ -f /etc/updatedb.conf ]; then
  sed -i -E 's|^[[:space:]]*PRUNE_BIND_MOUNTS[[:space:]]*=.*|PRUNE_BIND_MOUNTS = "no"|' /etc/updatedb.conf 2>/dev/null || true
  if ! grep -q 'PRUNEPATHS.*/.snapshots' /etc/updatedb.conf 2>/dev/null; then
    pruned=$(sed -nE 's|^[[:space:]]*PRUNEPATHS[[:space:]]*=[[:space:]]*"([^"]*)".*|\1|p' /etc/updatedb.conf | tail -n 1)
    sed -i -E "s|^[[:space:]]*PRUNEPATHS[[:space:]]*=.*|PRUNEPATHS = \"/.snapshots${pruned:+ $pruned}\"|" /etc/updatedb.conf 2>/dev/null || true
  fi
fi

echo "[Omarchy Fedora Setup] Post-install configuration complete!"
%end
